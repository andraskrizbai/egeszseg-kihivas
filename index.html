<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egészség Kihívás</title>
<meta name="description" content="Böjt, alvás és kalória követő kéthetes etapokban">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kihívás">
<meta name="application-name" content="Egészség Kihívás">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--green:#58CC02;--green-d:#58A700;--green-l:#D7FFB8;--gold:#FFC800;--gold-d:#E5A500;--blue:#1CB0F6;--blue-d:#1899D6;--red:#FF4B4B;--red-d:#EA2B2B;--orange:#FF9600;--gray:#E5E5E5;--gray-d:#AFAFAF;--text:#3C3C3C;--muted:#777;--bg:#F7F7F7;--card:#fff;--purple:#CE82FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:clip;padding:0;background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI Rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--gray);padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:6px 10px;border-radius:14px;background:#fff;border:2px solid var(--gray);white-space:nowrap}
.pill.flame{color:var(--orange)} .pill.flame.off{color:var(--gray-d);filter:grayscale(1)}
.pill.ice{color:var(--blue)} .pill.xp{color:var(--gold-d)} .pill.lvl{color:var(--purple)}
h1,h2,h3{margin:0;font-weight:900}
h2{font-size:22px} h3{font-size:18px}
.card{background:var(--card);border:2px solid var(--gray);border-radius:18px;padding:16px;margin:14px 0}
.card.hl{border-color:var(--green);background:linear-gradient(180deg,#fff, #f3ffe9)}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapf{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1}
.btn{appearance:none;border:none;border-radius:16px;padding:13px 18px;font-weight:900;font-size:16px;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .05s;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.block{width:100%}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#5a4100}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--gray);box-shadow:0 3px 0 var(--gray)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.icon{padding:4px 14px 8px;font-size:30px;line-height:1;font-weight:900;text-transform:none;min-width:48px}
label.f{display:block;font-weight:800;font-size:14px;margin:10px 0 4px;color:var(--muted)}
input,select{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--gray);border-radius:12px;background:#F7F7F7;color:var(--text);font-weight:700;min-width:0;max-width:100%}
input[type=datetime-local],input[type=time],input[type=date]{font-size:15px;padding:10px 8px;-webkit-appearance:none;appearance:none;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>div{min-width:0}
.goalhead{display:flex;align-items:center;gap:10px}
.gicon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.gicon.fast{background:#FFF0D6}.gicon.sleep{background:#E3F3FF}.gicon.kcal{background:#FFE5E5}
.res{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:800;background:#F7F7F7;display:flex;justify-content:space-between;align-items:center}
.res.ok{background:var(--green-l);color:#2b7a00}
.res.bad{background:#FFE8E8;color:#c22}
.chk{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:var(--gray);flex:none}
.chk.on{background:var(--green)}
.goals3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.goals3 div{text-align:center;border-radius:14px;padding:10px 4px;background:#F7F7F7;border:2px solid var(--gray);font-weight:800;font-size:13px}
.goals3 div.on{background:var(--green-l);border-color:var(--green);color:#2b7a00}
.goals3 .e{font-size:22px;display:block}
.bar{height:16px;border-radius:10px;background:var(--gray);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--gold);transition:width .5s}
.bar>i.g{background:var(--green)} .bar>i.b{background:var(--blue)} .bar>i.p{background:var(--purple)}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.datenav .d{font-weight:900;font-size:18px;text-align:center}
.ringwrap{display:flex;align-items:center;gap:16px}
.ringwrap>.grow{min-width:0}
.ringwrap .btn{white-space:normal}
@media (max-width:420px){.ringwrap{flex-direction:column;align-items:stretch}.ringwrap .ring{margin:0 auto}}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .t{font-size:22px;font-weight:900}
.ring .s{font-size:12px;color:var(--muted);font-weight:800}
.meals{list-style:none;padding:0;margin:10px 0 0}
.meals li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:2px dashed var(--gray);font-weight:700}
.meals li button{border:none;background:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--gray);background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--blue);font-family:inherit}
.chip.on{border-color:var(--blue);background:#E3F3FF}
.kbig{font-size:34px;font-weight:900}
/* path */
.path{display:flex;flex-direction:column;align-items:center;padding:10px 0 20px}
.node{position:relative;width:70px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin:10px 0 22px;cursor:pointer;border:none;font-family:inherit}
.node .lbl{position:absolute;top:68px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.node.gold{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.green{background:var(--green);box-shadow:0 7px 0 var(--green-d)}
.node.gray{background:#CFCFCF;box-shadow:0 7px 0 #A5A5A5}
.node.part{background:#CFCFCF;box-shadow:0 7px 0 #A5A5A5}
.node.future{background:var(--gray);box-shadow:0 7px 0 #CECECE;color:var(--gray-d);cursor:default}
.node.empty{background:#fff;border:3px dashed var(--gray-d);box-shadow:none;color:var(--gray-d)}
.node.today{outline:6px solid rgba(28,176,246,.35);outline-offset:4px;animation:pulse 1.6s infinite}
.node.today.empty{background:var(--blue);border:none;color:#fff;box-shadow:0 7px 0 var(--blue-d)}
@keyframes pulse{0%,100%{outline-color:rgba(28,176,246,.45)}50%{outline-color:rgba(28,176,246,.1)}}
.bubble{position:absolute;top:-34px;background:#fff;border:2px solid var(--gray);color:var(--blue);font-size:12px;padding:4px 8px;border-radius:10px;white-space:nowrap;font-weight:900}
.chest{margin:6px 0 26px;padding:10px 14px;border-radius:16px;border:2px solid var(--gray);background:#fff;font-weight:800;font-size:14px;text-align:center}
.chest.won{border-color:var(--blue);background:#E3F3FF;color:var(--blue-d)}
.trophy{font-size:52px;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;background:var(--c)}
.hist{border-top:2px solid var(--gray);padding:12px 0}
.hist:first-child{border-top:none}
.delta{font-weight:900;font-size:13px;padding:2px 8px;border-radius:8px}
.delta.up{background:var(--green-l);color:#2b7a00}.delta.down{background:#FFE8E8;color:#c22}.delta.eq{background:#eee;color:#777}
.league{display:inline-flex;align-items:center;gap:4px;font-weight:900;padding:4px 10px;border-radius:12px;font-size:14px}
.league.Bronz{background:#F6E1CF;color:#8B4C1A}.league.Ezüst{background:#ECEFF3;color:#5C6670}.league.Arany{background:#FFF4C2;color:#9A6B00}.league.Gyémánt{background:#DDF4FF;color:#0E7FB5}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{text-align:center;font-size:12px;font-weight:900;color:var(--gray-d)}
.cal button{aspect-ratio:1;border-radius:12px;border:2px solid var(--gray);background:#fff;font-weight:900;font-size:14px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;padding:0}
.cal button small{font-size:9px;letter-spacing:1px;line-height:1}
.cal button.gold{background:var(--gold);border-color:var(--gold-d);color:#5a4100}
.cal button.green{background:var(--green);border-color:var(--green-d);color:#fff}
.cal button.part{background:#E0E0E0;border-color:#C8C8C8}
.cal button.miss{background:#F0F0F0;border-color:#DDD;color:#999}
.cal button.today{outline:3px solid var(--blue);outline-offset:1px}
.cal button.future{opacity:.4;cursor:default}
.cal button.frozen{background:#E3F3FF;border-color:var(--blue)}
.cal .x{visibility:hidden}
/* stats */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:#F7F7F7;border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:20px;font-weight:900}
.stat3 span{font-size:12px;font-weight:800;color:var(--muted)}
svg text{font-family:inherit}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:10px 4px;border-radius:16px;border:2px solid var(--gray);background:#fff}
.badge .bi{font-size:34px;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFF4C2;box-shadow:0 4px 0 var(--gold-d)}
.badge b{display:block;font-size:13px;font-weight:900}
.badge small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.badge.locked{opacity:.55}.badge.locked .bi{filter:grayscale(1);background:#eee;box-shadow:0 4px 0 #ccc}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--gray);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;justify-content:space-around;padding:6px 4px}
.nav button{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 0;font-family:inherit;cursor:pointer;color:var(--gray-d);font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .i{font-size:24px;filter:grayscale(1);opacity:.7}
.nav button.on{border-color:#84D8FF;background:#DDF4FF;color:var(--blue)}
.nav button.on .i{filter:none;opacity:1}
/* toast, modal, confetti */
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:100;opacity:0;transition:.3s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:22px;padding:22px;max-width:400px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal .big{font-size:64px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.banner{background:#FFF4C2;border:2px solid var(--gold);border-radius:14px;padding:10px 12px;font-weight:800;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt{margin-top:12px}.mt0{margin-top:0}
.tip{font-size:13px;color:var(--muted);font-weight:700;text-align:center;margin:6px 0 16px}
.danger{border-color:#FFC1C1}

.flabel{font-weight:900;font-size:13px;color:var(--muted);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.4px}
.fsearch{margin-top:12px}
.fsearch input{font-size:17px;border-color:var(--blue);background:#fff}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:380px;overflow:auto}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%;border:2px solid var(--gray);border-radius:14px;background:#fff;padding:9px 12px;font-family:inherit;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;box-shadow:0 2px 0 var(--gray)}
.fitem:active{transform:translateY(2px);box-shadow:none}
.fitem small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.fitem .fn{min-width:0}
.fitem .fk{text-align:right;color:var(--orange);font-weight:900;white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;vertical-align:1px;letter-spacing:.5px}
.tag.on{background:#DDF4FF;color:var(--blue-d)}.tag.my{background:#F3E3FF;color:#9B4DCA}
.pick{margin-top:12px;border:2px solid var(--blue);background:#F2FAFF;border-radius:16px;padding:12px}
.pick .chip small{font-weight:700}
.fdet{margin-top:12px;border-top:2px solid var(--gray);padding-top:10px}
.fdet summary{font-weight:900;cursor:pointer;color:var(--blue);list-style:none}
.fdet summary::-webkit-details-marker{display:none}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.macros span{background:#F7F7F7;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:800;color:var(--muted)}
.macros b{color:var(--text)}
.chip small{font-size:11px}
</style>
</head>
<body>
<div class="top"><div class="wrap" id="top"></div></div>
<main class="wrap" id="main"></main>
<nav class="nav"><div class="wrap" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>
(function(){
"use strict";
var KEY = "egeszsegKihivas.v1";
var MONTHS = ["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
var MON_S = ["jan","febr","márc","ápr","máj","jún","júl","aug","szept","okt","nov","dec"];
var WD = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
var WD_S = ["H","K","Sze","Cs","P","Szo","V"];

/* ---------- dátum segédek ---------- */
function pad(n){return (n<10?"0":"")+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return fmt(d);}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000);}
function todayKey(){return fmt(new Date());}
function localDT(d){return fmt(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}
function parseDT(s){if(!s)return null;var m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);}
function huDate(k,withWd){var d=parseKey(k);return d.getFullYear()+". "+MONTHS[d.getMonth()]+" "+d.getDate()+"."+(withWd?", "+WD[d.getDay()]:"");}
function shortDate(k){var d=parseKey(k);return MON_S[d.getMonth()]+" "+d.getDate()+".";}
function mondayOf(k){var d=parseKey(k);var w=(d.getDay()+6)%7;return addDays(k,-w);}
function fmtH(h){if(h==null||isNaN(h))return "-";var m=Math.round(h*60);return Math.floor(m/60)+" ó "+pad(m%60)+" p";}
function fmtN(n,dec){if(n==null||isNaN(n))return "-";return Number(n).toFixed(dec||0).replace(".",",");}
function fmtK(n){if(n==null||isNaN(n))return "-";return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function mod(a,n){return ((a%n)+n)%n;}

/* ---------- étel adatbázis (kcal / 100 g, fehérje, szénhidrát, zsír g / 100 g) ---------- */

/* ---------- állapot ---------- */
function defaults(){
  return {version:1,settings:{name:"András",stageStart:todayKey(),fastTarget:16,sleepMin:7,sleepMax:9,kcalMin:2000,kcalMax:2200},
    days:{},timer:null,celebrated:{},seenBadges:{},customFoods:[],favFoods:[],recentFoods:[],lastStageSeen:0,created:new Date().toISOString()};
}
function normalize(o){
  var d=defaults();
  if(!o||typeof o!=="object")return d;
  var s=o.settings||{};
  for(var k in d.settings){if(s[k]!==undefined&&s[k]!==null&&s[k]!=="")d.settings[k]=s[k];}
  ["fastTarget","sleepMin","sleepMax","kcalMin","kcalMax"].forEach(function(k){d.settings[k]=Number(d.settings[k]);});
  d.days=(o.days&&typeof o.days==="object")?o.days:{};
  d.timer=o.timer||null;d.celebrated=o.celebrated||{};d.seenBadges=o.seenBadges||{};
  d.lastStageSeen=o.lastStageSeen||0;
  d.customFoods=Array.isArray(o.customFoods)?o.customFoods:[];d.favFoods=Array.isArray(o.favFoods)?o.favFoods:[];d.recentFoods=Array.isArray(o.recentFoods)?o.recentFoods:[];d.created=o.created||d.created;
  return d;
}
var S;
var storageOk=true;
try{S=normalize(JSON.parse(localStorage.getItem(KEY)));if(!localStorage.getItem(KEY))save();}catch(e){S=defaults();storageOk=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}

var UI={tab:"today",edit:todayKey(),cal:todayKey().slice(0,7),week:mondayOf(todayKey()),stageView:null};

/* ---------- értékelés ---------- */
function getDay(k){return S.days[k]||{};}
function ensureDay(k){if(!S.days[k])S.days[k]={};return S.days[k];}
function fastH(d){
  if(d.fastStart&&d.fastEnd){var a=parseDT(d.fastStart),b=parseDT(d.fastEnd);if(a&&b){var h=(b-a)/36e5;if(h>0&&h<96)return h;}return null;}
  if(d.fastManual!=null&&d.fastManual!=="")return Number(d.fastManual);
  return null;
}
function sleepH(d){
  if(d.bed&&d.wake){var b=d.bed.split(":"),w=d.wake.split(":");var m=(+w[0]*60+ +w[1])-(+b[0]*60+ +b[1]);if(m<=0)m+=1440;return m/60;}
  if(d.sleepManual!=null&&d.sleepManual!=="")return Number(d.sleepManual);
  return null;
}
function kcalT(d){if(d.meals&&d.meals.length){return d.meals.reduce(function(s,m){return s+(Number(m.k)||0);},0);}return null;}
function evalDay(k){
  var d=getDay(k),st=S.settings;
  var f=fastH(d),s=sleepH(d),c=kcalT(d);
  var fo=f!=null&&f>=st.fastTarget-1e-9;
  var so=s!=null&&s>=st.sleepMin-1e-9&&s<=st.sleepMax+1e-9;
  var co=c!=null&&c>=st.kcalMin&&c<=st.kcalMax;
  var n=(fo?1:0)+(so?1:0)+(co?1:0);
  return {fast:f,sleep:s,kcal:c,f:fo,s:so,c:co,n:n,logged:f!=null||s!=null||c!=null};
}
function dayXP(e){return e.n*10+(e.n===3?20:0);}
function levelFor(xp){var L=1;while(50*(L+1)*L<=xp)L++;return {level:L,start:50*L*(L-1),next:50*(L+1)*L};}
function league(score){
  if(score>=90)return {name:"Gyémánt",icon:"💎"};
  if(score>=75)return {name:"Arany",icon:"🥇"};
  if(score>=55)return {name:"Ezüst",icon:"🥈"};
  return {name:"Bronz",icon:"🥉"};
}
function stageIndexOf(k){return Math.floor(diffDays(S.settings.stageStart,k)/14);}
function stageInfo(i){
  var t=todayKey(),start=addDays(S.settings.stageStart,i*14),end=addDays(start,13);
  var days=[],sum=0,cnt=0,perfect=0,fs=[],ss=[],cs=[];
  for(var j=0;j<14;j++){
    var k=addDays(start,j),e=evalDay(k);var st;
    if(k>t)st="future";else{
      if(k<t||e.logged){sum+=e.n;cnt++;}
      if(e.n===3){st="gold";perfect++;}else if(e.n===2)st="green";else if(!e.logged)st="empty";else st="part";
      if(e.fast!=null)fs.push(e.fast);if(e.sleep!=null)ss.push(e.sleep);if(e.kcal!=null)cs.push(e.kcal);
    }
    days.push({k:k,e:e,st:st,today:k===t});
  }
  var finished=end<t;
  var score=cnt?Math.round(sum/(cnt*3)*100):0;
  if(finished)score=Math.round(sum/42*100);
  function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  var w1=days.slice(0,7).every(function(d){return d.st==="gold";}),w2=days.slice(7).every(function(d){return d.st==="gold";});
  return {i:i,start:start,end:end,days:days,finished:finished,score:score,elapsed:cnt,perfect:perfect,points:sum,
    lg:league(score),avgF:avg(fs),avgS:avg(ss),avgC:avg(cs),w1:w1,w2:w2,allPerfect:perfect===14};
}
var C=null;
function compute(){
  var t=todayKey(),st=S.settings;
  var keys=Object.keys(S.days).filter(function(k){return k<=t&&evalDay(k).logged;}).sort();
  var r={xp:0,streak:0,best:0,freezes:0,freezesEarned:0,used:{},totalFast:0,perfect:0,logged:keys.length,bestSleepRun:0,bestKcalRun:0,bestFastRun:0,todayCounted:false};
  if(keys.length){
    var sr=0,kr=0,fr=0;
    for(var k=keys[0];k<=t;k=addDays(k,1)){
      var e=evalDay(k);
      r.xp+=dayXP(e);
      if(e.fast!=null)r.totalFast+=e.fast;
      if(e.n===3)r.perfect++;
      sr=e.s?sr+1:(k===t?sr:0);kr=e.c?kr+1:(k===t?kr:0);fr=e.f?fr+1:(k===t?fr:0);
      r.bestSleepRun=Math.max(r.bestSleepRun,sr);r.bestKcalRun=Math.max(r.bestKcalRun,kr);r.bestFastRun=Math.max(r.bestFastRun,fr);
      var q=e.n>=2;
      if(k<t){
        if(q)r.streak++;
        else if(r.streak>0&&r.freezes>0){r.freezes--;r.used[k]=true;}
        else r.streak=0;
      }else if(q){r.streak++;r.todayCounted=true;}
      r.best=Math.max(r.best,r.streak);
      var idx=diffDays(st.stageStart,k);
      if(idx>=0){var pos=idx%14;if(pos===6||pos===13){var all=true;for(var j=0;j<7;j++){if(evalDay(addDays(k,-j)).n!==3){all=false;break;}}if(all){r.freezesEarned++;r.freezes=Math.min(3,r.freezes+1);}}}
    }
  }
  var lv=levelFor(r.xp);r.level=lv.level;r.lvStart=lv.start;r.lvNext=lv.next;
  r.cur=stageIndexOf(t);
  r.stages=[];for(var i=0;i<=r.cur;i++)r.stages.push(stageInfo(i));
  r.badges=badgeList(r);
  C=r;return r;
}
function badgeList(r){
  var fin=r.stages.filter(function(s){return s.finished;});
  var B=[
    ["elso","👣","Első lépés","Első naplózott nap",r.logged>=1],
    ["tokeletes1","⭐","Tökéletes nap","Mind a 3 cél egy nap alatt",r.perfect>=1],
    ["sor3","🔥","Bemelegítés","3 napos sorozat",r.best>=3],
    ["sor7","🔥","Lángoló hét","7 napos sorozat",r.best>=7],
    ["sor14","☄️","Két hét tűz","14 napos sorozat",r.best>=14],
    ["sor30","🌋","Megállíthatatlan","30 napos sorozat",r.best>=30],
    ["tok10","🌟","Csillaggyűjtő","10 tökéletes nap",r.perfect>=10],
    ["bojt100","⏳","100 óra böjt","Összesen 100 óra böjt",r.totalFast>=100],
    ["bojt500","🏺","500 óra böjt","Összesen 500 óra böjt",r.totalFast>=500],
    ["alvas7","😴","Álomkirály","7 nap egymás után jó alvás",r.bestSleepRun>=7],
    ["kcal7","🥗","Kalóriamester","7 nap egymás után a keretben",r.bestKcalRun>=7],
    ["bojt7","🕰️","Böjtbajnok","7 nap egymás után 16+ óra",r.bestFastRun>=7],
    ["jeg","❄️","Jégre téve","Első tökéletes hét, jégkocka",r.freezesEarned>=1],
    ["etap","🏆","Hibátlan etap","14 tökéletes nap egy etapban",r.stages.some(function(s){return s.allPerfect;})],
    ["arany","🥇","Arany liga","Etap zárása Arany ligában",fin.some(function(s){return s.score>=75;})],
    ["gyemant","💎","Gyémánt liga","Etap zárása Gyémánt ligában",fin.some(function(s){return s.score>=90;})],
    ["szint5","🎖️","5. szint","Érd el az 5. szintet",levelFor(r.xp).level>=5],
    ["szint10","👑","10. szint","Érd el a 10. szintet",levelFor(r.xp).level>=10]
  ];
  return B.map(function(b){return {id:b[0],icon:b[1],name:b[2],desc:b[3],on:!!b[4]};});
}

function deltaTag(a,b,unit,dec,invert){

}

function weekVals(mon){
  var r={f:[],s:[],c:[],keys:[]};for(var i=0;i<7;i++){var k=addDays(mon,i),e=evalDay(k);r.keys.push(k);r.f.push(e.fast);r.s.push(e.sleep);r.c.push(e.kcal);}
  function avg(a){var b=a.filter(function(x){return x!=null;});return b.length?b.reduce(function(x,y){return x+y;},0)/b.length:null;}
  r.af=avg(r.f);r.as=avg(r.s);r.ac=avg(r.c);
  r.okF=r.f.filter(function(x){return x!=null&&x>=S.settings.fastTarget;}).length;
  r.okS=r.s.filter(function(x){return x!=null&&x>=S.settings.sleepMin&&x<=S.settings.sleepMax;}).length;
  r.okC=r.c.filter(function(x){return x!=null&&x>=S.settings.kcalMin&&x<=S.settings.kcalMax;}).length;
  return r;
}
function chart(vals,o){
  var W=320,H=170,L=34,R=8,T=18,B=24,cw=(W-L-R)/7,ih=H-T-B;
  var mx=o.max;vals.forEach(function(v){if(v!=null&&v>mx)mx=v;});mx=Math.ceil(mx/o.step)*o.step;
  function y(v){return T+ih-(v/mx)*ih;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+o.title+'">';
  for(var g=0;g<=mx;g+=o.step){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#EEE"/><text x="'+(L-5)+'" y="'+(y(g)+4)+'" font-size="10" text-anchor="end" fill="#999">'+o.lab(g)+'</text>';}
  var hiB=o.hi==null?mx:o.hi;if(o.lo!=null)s+='<rect x="'+L+'" width="'+(W-L-R)+'" y="'+y(hiB)+'" height="'+Math.max(0,y(o.lo)-y(hiB))+'" fill="#58CC02" opacity=".13"/>';
  if(o.lo!=null)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.lo)+'" y2="'+y(o.lo)+'" stroke="#58A700" stroke-dasharray="4 3"/>';
  if(o.hi!=null&&o.hi!==o.lo)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.hi)+'" y2="'+y(o.hi)+'" stroke="#58A700" stroke-dasharray="4 3"/>';
  vals.forEach(function(v,i){
    var x=L+i*cw+cw*0.2,bw=cw*0.6;
    if(v==null){s+='<rect x="'+x+'" y="'+(T+ih-3)+'" width="'+bw+'" height="3" rx="1.5" fill="#DDD"/>';}
    else{var ok=v>=o.lo&&(o.hi==null||v<=o.hi);var hh=Math.max(2,T+ih-y(v));
      s+='<rect x="'+x+'" y="'+(T+ih-hh)+'" width="'+bw+'" height="'+hh+'" rx="6" fill="'+(ok?"#58CC02":"#FF9600")+'"/><text x="'+(x+bw/2)+'" y="'+(T+ih-hh-4)+'" font-size="10" font-weight="800" text-anchor="middle" fill="#555">'+o.val(v)+'</text>';}
    s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" font-size="11" font-weight="800" text-anchor="middle" fill="#999">'+WD_S[i]+'</text>';
  });
  return s+'</svg>';
}

    '<p class="muted" style="text-align:center">Teljesített napok: böjt '+w.okF+'/7 · alvás '+w.okS+'/7 · kalória '+w.okC+'/7. A címkék az előző héthez képest mutatják a változást.</p></div>';
  h+='<div class="card"><h3>⏳ Böjt (óra)</h3>'+chart(w.f,{title:"Böjt",max:20,step:4,lo:st.fastTarget,hi:null,lab:function(g){return g;},val:function(v){return fmtN(v,1);}})+'</div>';
  h+='<div class="card"><h3>😴 Alvás (óra)</h3>'+chart(w.s,{title:"Alvás",max:10,step:2,lo:st.sleepMin,hi:st.sleepMax,lab:function(g){return g;},val:function(v){return fmtN(v,1);}})+'</div>';
  h+='<div class="card"><h3>🥗 Kalória (kcal)</h3>'+chart(w.c,{title:"Kalória",max:2600,step:500,lo:st.kcalMin,hi:st.kcalMax,lab:function(g){return g;},val:function(v){return Math.round(v);}})+'</div>';
  h+='<div class="card"><h3>Összesítés</h3><div class="stat3 mt"><div><b>'+fmtK(C.totalFast)+'</b><span>böjt óra összesen</span></div><div><b>'+C.perfect+'</b><span>tökéletes nap</span></div><div><b>'+C.best+'</b><span>leghosszabb sorozat</span></div></div></div>';
  return h;
}

function vProfile(){
  var st=S.settings,lvPct=(C.xp-C.lvStart)/(C.lvNext-C.lvStart)*100;
  var h='<div class="card hl mt"><div class="row"><div class="gicon" style="background:var(--green);color:#fff;width:64px;height:64px;font-size:30px;border-radius:50%">'+esc((st.name||"A").charAt(0))+'</div><div class="grow"><h2>'+esc(st.name)+'</h2><div class="muted">'+C.level+'. szint · '+fmtK(C.xp)+' XP</div></div></div>'+
    '<div class="bar mt"><i class="p" style="width:'+lvPct+'%"></i></div><p class="muted" style="margin:6px 0 0">Még '+fmtK(C.lvNext-C.xp)+' XP a '+(C.level+1)+'. szintig</p>'+
    '<div class="stat3 mt"><div><b>🔥 '+C.streak+'</b><span>sorozat</span></div><div><b>🧊 '+C.freezes+'</b><span>jégkocka (max 3)</span></div><div><b>⭐ '+C.perfect+'</b><span>tökéletes nap</span></div></div>'+
    '<p class="muted">Sorozat: minden nap, amikor legalább 2 cél teljesül. Jégkockát egy etap minden tökéletes hete ad (1-7. és 8-14. nap), és automatikusan megvéd egy kihagyott napot.</p></div>';
  var on=C.badges.filter(function(b){return b.on;}).length;
  h+='<div class="card"><div class="row sp"><h3>Jelvények</h3><b class="muted">'+on+'/'+C.badges.length+'</b></div><div class="badges mt">'+C.badges.map(function(b){return '<div class="badge'+(b.on?"":" locked")+'"><div class="bi">'+b.icon+'</div><b>'+b.name+'</b><small>'+b.desc+'</small></div>';}).join("")+'</div></div>';
  h+='<div class="card"><h3>Beállítások</h3>'+
    '<label class="f">Név</label><input id="sName" value="'+esc(st.name)+'">'+
    '<label class="f">Etap kezdőnapja (14 napos etapok innen gördülnek)</label><input type="date" id="sStart" value="'+st.stageStart+'">'+
    '<label class="f">Böjt cél (óra)</label><input type="number" step="0.5" min="1" max="48" id="sFast" value="'+st.fastTarget+'">'+
    '<div class="grid2"><div><label class="f">Alvás min (óra)</label><input type="number" step="0.25" min="0" max="24" id="sSMin" value="'+st.sleepMin+'"></div><div><label class="f">Alvás max (óra)</label><input type="number" step="0.25" min="0" max="24" id="sSMax" value="'+st.sleepMax+'"></div></div>'+
    '<div class="grid2"><div><label class="f">Kalória min</label><input type="number" step="50" min="0" id="sKMin" value="'+st.kcalMin+'"></div><div><label class="f">Kalória max</label><input type="number" step="50" min="0" id="sKMax" value="'+st.kcalMax+'"></div></div>'+
    '<button class="btn block mt" data-act="saveSettings">Mentés</button><p class="muted">A célok módosítása visszamenőleg is újraszámolja az eredményeket.</p></div>';
  h+='<div class="card"><h3>Biztonsági mentés</h3><p class="muted">Az adatok csak ebben a böngészőben tárolódnak. Időnként ments JSON fájlba. A mentés a saját ételeket, kedvenceket és legutóbbiakat is tartalmazza ('+(S.customFoods||[]).length+' saját étel).</p>'+
    '<div class="row wrapf"><button class="btn blue grow" data-act="export">Exportálás</button><button class="btn ghost grow" data-act="import">Importálás</button></div><input type="file" id="impFile" accept="application/json,.json" style="display:none"></div>';
  h+='<div class="card danger"><h3>Újrakezdés</h3><p class="muted">Minden napló, XP, jelvény és beállítás törlődik.</p><button class="btn red block" data-act="reset">Minden adat törlése</button></div>';
  h+='<p class="tip">Egészség Kihívás · offline, egyetlen fájl · '+Object.keys(S.days).length+' nap tárolva</p>';
  return h;
}

/* ---------- időzítő ---------- */
function tick(){
  var arc=document.getElementById("ringArc");if(!arc)return;
  var tm=S.timer,T=S.settings.fastTarget*3600;
  if(!tm){arc.style.strokeDashoffset=389.6;return;}
  var st=parseDT(tm.start);var el=Math.max(0,(Date.now()-st.getTime())/1000);
  var p=Math.min(1,el/T);arc.style.strokeDashoffset=389.6*(1-p);arc.setAttribute("stroke",p>=1?"#58CC02":"#FF9600");
  function hms(s){s=Math.floor(s);return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);}
  document.getElementById("ringTime").textContent=hms(el);
  document.getElementById("ringSub").textContent=el>=T?"Cél megvan! +"+hms(el-T):"még "+hms(T-el);
}
setInterval(tick,1000);

/* ---------- események ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el||el.disabled)return;
  var a=el.getAttribute("data-act"),v=el.getAttribute("data-v"),k=UI.edit,d;
  switch(a){
    case "tab":UI.tab=v;if(v==="today"&&UI.edit>todayKey())UI.edit=todayKey();window.scrollTo(0,0);render();break;
    case "closeModal":if(el.classList.contains("modalbg")&&ev.target!==el)break;closeModal();break;
    case "day":var nk=addDays(UI.edit,+v);if(nk<=todayKey()){UI.edit=nk;render();}break;
    case "gotoToday":UI.edit=todayKey();render();break;
    case "openDay":UI.edit=v;UI.tab="today";window.scrollTo(0,0);render();break;
    case "stage":UI.stageView=(UI.stageView==null?C.cur:UI.stageView)+(+v);render();break;
    case "cal":var p=UI.cal.split("-"),dt=new Date(+p[0],+p[1]-1+(+v),1);UI.cal=dt.getFullYear()+"-"+pad(dt.getMonth()+1);render();break;
    case "week":var nw=addDays(UI.week,7*(+v));if(nw<=todayKey()){UI.week=nw;render();}break;
    case "startFast":S.timer={start:localDT(new Date())};save();render();toast("Böjt elindítva. Hajrá!");break;
    case "cancelFast":if(confirm("Biztosan elveted a futó böjtöt?")){S.timer=null;save();render();}break;
    case "stopFast":
      var now=new Date(),dk=fmt(now),dd=ensureDay(dk);
      if((dd.fastStart&&dd.fastEnd)||dd.fastManual!=null){if(!confirm("Erre a napra már van böjt adat. Felülírod?"))break;}
      dd.fastStart=S.timer.start;dd.fastEnd=localDT(now);delete dd.fastManual;S.timer=null;UI.edit=dk;
      var hh=fastH(dd);toast(hh>=S.settings.fastTarget?"Szép munka! "+fmtH(hh)+" böjt":"Böjt rögzítve: "+fmtH(hh));afterChange(dk);break;
    case "fastPreset":var pr=v.split("|");d=ensureDay(k);d.fastStart=addDays(k,-1)+"T"+pr[0];d.fastEnd=k+"T"+pr[1];delete d.fastManual;afterChange(k);break;
    case "clearFast":d=ensureDay(k);delete d.fastStart;delete d.fastEnd;delete d.fastManual;afterChange(k);break;
    case "clearSleep":d=ensureDay(k);delete d.bed;delete d.wake;delete d.sleepManual;afterChange(k);break;
    case "mealName":UI.mealIdx=+v;document.querySelectorAll("#mealNames .chip").forEach(function(c,i){c.classList.toggle("on",i===+v);});break;
    case "addMeal":
      var inp=document.getElementById("kcalIn"),val=Math.round(Number(String(inp.value).replace(",",".")));
      if(!val||val<0||val>10000){toast("Adj meg egy kcal értéket");inp.focus();break;}
      var names=["Reggeli","Ebéd","Vacsora","Nasi","Napi összes"],nm=names[UI.mealIdx||0];d=ensureDay(k);
      if(nm==="Napi összes"){if(d.meals&&d.meals.length&&!confirm("Lecseréled az eddigi tételeket a napi összegre?"))break;d.meals=[{n:nm,k:val}];}
      else{d.meals=d.meals||[];d.meals.push({n:nm,k:val});}
      afterChange(k);break;
    case "pickFood":var pf=foodById(v);if(pf)showPick(pf);break;
    case "pickUnit":UI.pickUnit=v;UI.pickAmt=null;document.getElementById("foodPick").innerHTML=pickHTML();updatePick();break;
    case "cancelPick":UI.pick=null;document.getElementById("foodPick").innerHTML="";break;
    case "favFood":
      var ff=UI.pick;if(!ff)break;S.favFoods=S.favFoods||[];
      if(isFav(ff.id)){S.favFoods=S.favFoods.filter(function(x){return x.id!==ff.id;});toast("Eltávolítva a kedvencek közül");}
      else{S.favFoods.unshift(snap(ff));toast("⭐ Kedvencekhez adva");}
      save();document.getElementById("foodPick").innerHTML=pickHTML();updatePick();renderFoodRes();break;
    case "addFood":
      var fo=UI.pick,gr=pickGrams();if(!fo)break;if(!gr){toast("Adj meg mennyiséget");break;}
      var cc=calcFood(fo,gr),un=UI.pickUnit||(fo.pg?"p":"g"),am=Number(String(document.getElementById("pickAmt").value).replace(",","."));
      var mn=["Reggeli","Ebéd","Vacsora","Nasi","Egyéb"][UI.mealIdx||0];
      d=ensureDay(k);d.meals=d.meals||[];d.meals.push({n:mn,food:fo.n,g:Math.round(gr),k:cc.k,p:cc.p,c:cc.c,f:cc.f,fid:fo.id});
      var rs=snap(fo);rs.lastG=Math.round(gr);rs.lastU=un;rs.lastA=am;
      S.recentFoods=[rs].concat((S.recentFoods||[]).filter(function(x){return x.id!==fo.id;})).slice(0,15);
      S.favFoods=(S.favFoods||[]).map(function(x){if(x.id===fo.id){var y=snap(fo);y.lastG=rs.lastG;y.lastU=un;y.lastA=am;return y;}return x;});
      UI.pick=null;UI.foodQ="";UI.online=null;toast("+"+fmtK(cc.k)+" kcal: "+fo.n);afterChange(k);break;
    case "offSearch":var oq=(UI.foodQ||"").trim();if(oq)offSearch(oq);break;
    case "offBarcode":offBarcode(document.getElementById("barcodeIn").value);break;
    case "saveCustom":
      var gv=function(id){return String(document.getElementById(id).value).replace(",",".").trim();};
      var cn=gv("cfN"),ck=Number(gv("cfK"));
      if(!cn||!(ck>=0)||gv("cfK")===""){toast("A név és a kcal / 100 g kötelező");break;}
      var cfo={id:"c"+Date.now().toString(36),n:cn,k:Math.round(ck),p:r1(Number(gv("cfP"))||0),c:r1(Number(gv("cfC"))||0),f:r1(Number(gv("cfF"))||0),pl:gv("cfPl")||(Number(gv("cfPg"))>0?"1 adag":""),pg:Math.round(Number(gv("cfPg"))||0),cat:"C",src:"sajat"};
      S.customFoods=S.customFoods||[];S.customFoods.unshift(cfo);save();UI.cfOpen=false;if(UI.det)UI.det.cf=false;render();showPick(cfo);toast("Saját étel mentve: "+cn);break;
    case "delCustom":
      var dc=(S.customFoods||[]).filter(function(x){return x.id===v;})[0];if(!dc||!confirm("Törlöd a(z) \""+dc.n+"\" saját ételt? A már felvett bejegyzések megmaradnak."))break;
      S.customFoods=S.customFoods.filter(function(x){return x.id!==v;});S.favFoods=(S.favFoods||[]).filter(function(x){return x.id!==v;});S.recentFoods=(S.recentFoods||[]).filter(function(x){return x.id!==v;});
      if(UI.pick&&UI.pick.id===v)UI.pick=null;save();UI.cfOpen=true;render();break;
    case "delMeal":d=ensureDay(k);d.meals.splice(+v,1);afterChange(k);break;
    case "saveSettings":
      var g=function(id){return document.getElementById(id).value;};
      var ns={name:g("sName").trim()||"András",stageStart:g("sStart")||S.settings.stageStart,fastTarget:+g("sFast"),sleepMin:+g("sSMin"),sleepMax:+g("sSMax"),kcalMin:+g("sKMin"),kcalMax:+g("sKMax")};
      if(!(ns.fastTarget>0)||!(ns.sleepMin>0)||!(ns.sleepMax>=ns.sleepMin)||!(ns.kcalMin>0)||!(ns.kcalMax>=ns.kcalMin)){toast("Ellenőrizd az értékeket: a max nem lehet kisebb a min-nél");break;}
      S.settings=ns;UI.stageView=null;S.lastStageSeen=Math.max(0,stageIndexOf(todayKey()));save();compute();checkBadges();render();toast("Beállítások mentve");break;
    case "export":
      var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),ln=document.createElement("a");
      ln.href=url;ln.download="egeszseg-kihivas-mentes-"+todayKey()+".json";document.body.appendChild(ln);ln.click();setTimeout(function(){URL.revokeObjectURL(url);ln.remove();},1000);toast("Mentés letöltve");break;
    case "import":document.getElementById("impFile").click();break;
    case "reset":
      if(!confirm("Biztosan törölsz MINDEN adatot? Ez nem vonható vissza."))break;
      var w=prompt('A megerősítéshez írd be: TÖRLÉS');if(w==null||w.trim().toUpperCase()!=="TÖRLÉS"){toast("Törlés megszakítva");break;}
      S=defaults();save();UI={tab:"today",edit:todayKey(),cal:todayKey().slice(0,7),week:mondayOf(todayKey()),stageView:null};compute();render();toast("Minden adat törölve. Új kezdet!");break;
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.id==="impFile"){
    var f=el.files&&el.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||typeof o.days!=="object"||!o.settings)throw new Error("x");
      if(!confirm("Az importálás felülírja a jelenlegi adatokat ("+Object.keys(o.days).length+" nap). Folytatod?"))return;
      S=normalize(o);save();compute();render();toast("Adatok visszatöltve");}catch(e){toast("Hibás mentésfájl");}};
    rd.readAsText(f);el.value="";return;
  }
  var fld=el.getAttribute("data-f");if(!fld)return;
  var k=UI.edit,v=el.value;
  if(fld==="timerStart"){if(v&&S.timer&&parseDT(v)<=new Date()){S.timer.start=v;save();render();}else toast("A kezdés nem lehet a jövőben");return;}
  var d=ensureDay(k);
  if(fld==="fastManual"||fld==="sleepManual"){
    var n=String(v).replace(",",".");
    if(n===""){delete d[fld];}else{d[fld]=Number(n);if(fld==="fastManual"){delete d.fastStart;delete d.fastEnd;}else{delete d.bed;delete d.wake;}}
  }else{
    if(v)d[fld]=v;else delete d[fld];
    if(fld==="fastStart"&&v&&!d.fastEnd){d.fastEnd=k+"T12:00";}
    if(fld==="fastEnd"&&v&&!d.fastStart){d.fastStart=addDays(k,-1)+"T20:00";}
    if(fld==="fastStart"||fld==="fastEnd")delete d.fastManual;
    if(fld==="bed"||fld==="wake")delete d.sleepManual;
  }
  afterChange(k);
});
document.addEventListener("toggle",function(ev){var t=ev.target;if(t&&t.getAttribute&&t.getAttribute("data-det")){UI.det=UI.det||{};UI.det[t.getAttribute("data-det")]=t.open;}},true);
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="foodQ"){UI.foodQ=el.value;if(UI.online&&!UI.online.barcode&&UI.online.q!==el.value.trim())UI.online=null;if(UI.online&&UI.online.barcode&&el.value)UI.online=null;renderFoodRes();}
  else if(el.id==="pickAmt"){UI.pickAmt=el.value;updatePick();}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="pickAmt"){ev.preventDefault();var ab=document.querySelector('[data-act="addFood"]');if(ab)ab.click();return;}
  if(ev.key==="Enter"&&ev.target.id==="barcodeIn"){ev.preventDefault();offBarcode(ev.target.value);return;}
  if(ev.key==="Enter"&&ev.target.id==="foodQ"){ev.preventDefault();var first=document.querySelector('#foodRes .fitem');if(first)first.click();return;}if(ev.key==="Enter"&&ev.target.id==="kcalIn"){var b=document.querySelector('[data-act="addMeal"]');if(b)b.click();}});
document.addEventListener("visibilitychange",function(){if(!document.hidden){var t=todayKey();if(UI.lastToday&&UI.lastToday!==t){if(UI.edit===UI.lastToday)UI.edit=t;compute();render();}UI.lastToday=t;}});
UI.lastToday=todayKey();

/* ---------- indulás ---------- */
compute();
render();
// etapváltás értesítés
(function(){
  var cur=C.cur;
  if(cur>=1&&cur>(S.lastStageSeen||0)){
    var s=C.stages[cur-1],prev=C.stages[cur-2];
    S.lastStageSeen=cur;save();
    if(Object.keys(S.days).length){
      confetti();
      modal('<div class="big">'+s.lg.icon+'</div><h2>'+(s.i+1)+'. etap lezárva!</h2><p><span class="league '+s.lg.name+'">'+s.lg.name+' liga</span></p><p class="muted">Pontszám: <b>'+s.score+'%</b>'+(prev?deltaTag(s.score,prev.score,"%",0):"")+'<br>'+s.perfect+' tökéletes nap a 14-ből</p><p style="font-weight:800">Indul a '+(cur+1)+'. etap. Hajrá!</p><button class="btn block" data-act="closeModal">Tovább</button>');
    }
  }else if(cur>=0&&S.lastStageSeen==null){S.lastStageSeen=cur;save();}
})();
checkBadges();
})();
</script>
